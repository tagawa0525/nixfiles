# =============================================================================
# OpenLogi fork の drift 検知
# =============================================================================
# fork (tagawa0525/OpenLogi) の master HEAD に対して cargo vendor の取得を
# 毎日検証する。pkgs/openlogi/package.nix の outputHashes は git 依存
# （gpui 等）の rev が動くと無効になるが、fork には nix ビルドの CI が無い
# ため、放置すると次の flake update まで気づけない。このワークフローが
# 落ちたら、エラーログに印字される正しいハッシュを outputHashes に反映する。
# gpui-component の rev が動いていた場合は、themes 用の gpuiComponentRev も
# fork の Cargo.lock に合わせて更新する（このジョブのログには出ないので
# lock を見る。放置しても rev 不一致はハッシュ不一致として検出される）。
#
# vendor 取得（openlogi-cargo-deps）だけを対象にし、rust のコンパイルは
# しない。ハッシュずれの検知には十分で、数分で終わる。コンパイルまで通る
# ことの確認は、通常の nix flake update フロー（全ホストビルド）が担う。
# =============================================================================
name: openlogi drift check

on:
  schedule:
    - cron: "30 20 * * *" # 毎日 05:30 JST
  workflow_dispatch: # 手動実行も可

permissions:
  contents: read

jobs:
  vendor-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: fork master HEAD に対して vendor 取得を検証
        # ブランチを明示する（省略すると既定ブランチ依存になり、既定が
        # 変わった場合に意図しないブランチを検証してしまう）
        run: |
          nix build .#openlogi-cargo-deps \
            --override-input openlogi-src github:tagawa0525/OpenLogi/master \
            --no-link --print-build-logs
