# =============================================================================
# zellij-slots: スロット式タブ管理プラグイン
# =============================================================================
# tmux の window 番号運用（固定番号 + 優先順位での空き番号割当）を
# Zellij のタブ名で再現する。zellij.nix からビルドされる。
# =============================================================================
[package]
name = "zellij-slots"
version = "0.1.0"
edition = "2021"

[dependencies]
zellij-tile = "0.44.3"
