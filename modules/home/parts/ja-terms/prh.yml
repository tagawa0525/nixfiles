  - expected: 経過時間
    # wall-clock time の直訳。「壁時計で測った時間」は全体を、「壁時計の時間」「壁時計時間」「壁時計」は語を「経過時間」にし、
    # 時計そのものの意味（壁時計の時刻、壁時計を見る、壁時計の針、壁時計を合わせる、壁時計が遅れる、壁時計の遅れ、壁時計を進める）は
    # 通す。除外は任意の「の時間」より前に置く（後ろに置くと「壁時計の時間を見る」で「壁時計」だけが置き換わる）。行の
    # 折り返し（\n）は `包み` の規則と同じく除外（消費しない位置）だけで許し、「壁時計⏎の時間」は置き換えると 2 行が
    # 結合するか「経過時間の時間」になるので通す（手で直す）
    pattern: /壁時計で測(?:った|る)時間|壁時計(?!\n?の?\n?(?:時刻|遅れ|進み)|\n?を\n?(?:見|読|進め)|\n?の\n?針|\n?[をに]\n?合わせ|\n?が\n?(?:遅れ|進)|\nの?時間)(?:の?時間)?/
    specs:
      - from: 壁時計の時間で反復の約 1/4
        to: 経過時間で反復の約 1/4
      - from: 16 スレッドの壁時計は 63.2 秒
        to: 16 スレッドの経過時間は 63.2 秒
      - from: 壁時計時間で 63 秒
        to: 経過時間で 63 秒
      - from: 壁時計で測った時間は 63 秒
        to: 経過時間は 63 秒
      - from: 壁時計の時刻を読む
        to: 壁時計の時刻を読む
      - from: 壁時計が遅れている
        to: 壁時計が遅れている
      - from: 壁時計の時間を見る
        to: 経過時間を見る
      - from: 壁時計の遅れを直す
        to: 壁時計の遅れを直す
  - expected: バックグラウンド
    # background の直訳。σ0 の意味（背景断面積、背景 σ0、負の背景、背景の R 行列）と、background job の意味
    # （背景で回す、背景で走る、背景に投げる、背景で待つ、背景のジョブ・タスク・プロセス。動詞は語幹と活用語尾の文字クラスで
    # 書き、「背景に流れる」「背景で回避」「背景で走査」「背景に投げかける」は通す）だけ止める。ADR の「背景」の節（背景では、
    # 背景である、背景が負担、背景の担当者、背景の操作）は通す。「背景に足す」「背景を変えて」「背景なし」「背景が負」は σ0 の
    # 意味でも文脈で決まるので入れず、手で直す。「負の」の前は漢字でない（勝負の背景、正負の背景を通す）。続きの前と
    # 「負の」の後の行の折り返しは消費しない位置で許す。\s や \d を使わないのは、history-rewrite の Python 側が同じ辞書を
    # 読むため
    pattern: /(?<=(?<![一-龥])負の\n?)背景|背景(?=\n?断面積|\n? ?σ0|\n?の\n? ?σ0|\n?の R 行列|\n?(?:で|に)\n?(?:回[すさし]|走[らりるっ]|流[すさし]|投げ(?:る|た|て|ます)|待[つたっ]|動か[すさし])|\n?の\n?(?:ジョブ|タスク|プロセス))/
    specs:
      - from: 背景断面積 σ0 で遮蔽する
        to: バックグラウンド断面積 σ0 で遮蔽する
      - from: 負の背景を足す
        to: 負のバックグラウンドを足す
      - from: チェックを背景で回す
        to: チェックをバックグラウンドで回す
      - from: チェックが背景で走る
        to: チェックがバックグラウンドで走る
      - from: 背景のジョブを待つ
        to: バックグラウンドのジョブを待つ
      - from: ADR の背景では付けてよいとした
        to: ADR の背景では付けてよいとした
      - from: 決定の背景である
        to: 決定の背景である
      - from: この決定の背景に流れる考え
        to: この決定の背景に流れる考え
      - from: 勝負の背景を書く
        to: 勝負の背景を書く
      - from: ADR の背景が負担になる
        to: ADR の背景が負担になる
      - from: 背景で走査する
        to: 背景で走査する
  - expected: ステージ
    # DVC とパイプラインのステージ。「DVC の」の直後と、DVC の文脈で決まる続き（を流す、を投げる、を再実行、が走る、
    # は走らない、が再実行、の deps・outs・cmd・md5。動詞の前に「1 本ずつ」「すべて」「再度」などを許す）の前だけ止める。
    # 名前の形（xs-nuclide の段階）で判定しないのは、名前がインラインコードだと textlint が前の語を見ないのと、日付や
    # ADR の番号の後の「段階では」を止めないため。「上流の段階」「段階の出力」は手順の意味（設計の上流の段階、前の段階の
    # 出力）と分けられないので入れない。手順の段階（次の段階を実行する、PR の段階、前の段階、この段階、最終段階、
    # 現段階、初期段階）、数の後（2 段階の手法、二段階、2 つの段階）、「段階的」は通す。続きの前と除外の後の行の折り返しは
    # 消費しない位置で許す
    pattern: /(?<=DVC の)段階(?!的)|(?<!(?:[0-9０-９] |[0-9０-９一二三四五六七八九十]|つの|つ目の|前|前の|後の|次|次の|この|その|今の|現|初期|最初の|各|全|両|同じ|最終)\n?)段階(?=\n?を\n?(?:[ ]1 本ずつ|すべて|全部|再度|再び|一度)?(?:流|投げ|再実行)|\n?(?:が|は|も)\n?(?:走|再実行)|\n?の\n? (?:md5|deps|outs|cmd))/
    specs:
      - from: DVC の段階を流す
        to: DVC のステージを流す
      - from: xs-nuclide の段階を流す
        to: xs-nuclide のステージを流す
      - from: 重い段階を 1 本ずつ流す
        to: 重いステージを 1 本ずつ流す
      - from: 上流の段階の deps が変わる
        to: 上流のステージの deps が変わる
      - from: core の段階は走らない
        to: core のステージは走らない
      - from: xs の段階の md5 を比べる
        to: xs のステージの md5 を比べる
      - from: 2 段階の手法を使う
        to: 2 段階の手法を使う
      - from: 二段階の出力を比べる
        to: 二段階の出力を比べる
      - from: 次の段階を実行する
        to: 次の段階を実行する
      - from: 前の段階の出力を入力にする
        to: 前の段階の出力を入力にする
      - from: 2026-10-22 の段階では未対応
        to: 2026-10-22 の段階では未対応
      - from: PR の段階で気づく
        to: PR の段階で気づく
      - from: 設計の上流の段階で決める
        to: 設計の上流の段階で決める
