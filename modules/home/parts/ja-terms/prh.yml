# 崩れた日本語の語の辞書（ADR-0014）。グローバルの pre-commit と commit-msg が textlint-rule-prh で使う。
#
# 型は 2 つ。動詞の連用形をそのまま名詞にしたもの（確かめ、比べ、数え）は、前後の文字で名詞の用法だけを
# 止め、動詞（確かめる、比べると）は通す。英語の直訳の造語は、その語だけを止める。直す語が文脈で変わる語
# （「効き」は「影響」「効果」「効くか」のどれにもなる）は、1 つの語に直せないので入れない。
# specs は prh が辞書を読み込むときに確かめる例（from を to に直す）。
#
# 出典: xlc の references/history-rewrite/cb_lib.py の RULES（2026-10-11 に xlc の履歴を書き換えたときの規則。
# xlc に固有の 2 つと、文脈で直す語が変わる「効き」は除く）、nixfiles と xlc のメモリへのユーザーの指摘
version: 1
rules:
  - expected: 確認
    # 直後が「の」「を」などの名詞の用法だけを止める。「に」「も」「は」と空白、行末は動詞にも続く（確かめにくい、
    # 確かめもせず、確かめはした、確かめ Slurm に、行の折り返しの 確かめ⏎る）。「が」も、後に「たい」「ち」
    # 「てら」が続けば動詞（確かめがたい、確かめがち、確かめがてら）
    pattern: /確かめ(?=[のでをだ：:）」]|が(?!たい|ち|てら))/
    specs:
      - from: 確かめの結果
        to: 確認の結果
      - from: 確かめが通る
        to: 確認が通る
      - from: 結果を確かめる
        to: 結果を確かめる
      - from: 確かめにくい
        to: 確かめにくい
      - from: 確かめもせず
        to: 確かめもせず
      - from: 確かめがたい
        to: 確かめがたい
  - expected: 比較
    pattern: /比べ合わせ(?=[のでをだ：:）」]|が(?!たい|ち|てら))/
    specs:
      - from: 比べ合わせの結果
        to: 比較の結果
      - from: 2 つを比べ合わせると
        to: 2 つを比べ合わせると
  - expected: 比較
    pattern: /(?<=[の、])比べ(?=[での」（]|が(?!たい|ち|てら))/
    specs:
      - from: 2 つの比べでは
        to: 2 つの比較では
      - from: 、比べが
        to: 、比較が
      - from: 、比べはした
        to: 、比べはした
      - from: 2 つを比べると
        to: 2 つを比べると
  - expected: 計数
    pattern: /(?<=の)数え(?=[のを）：:]|が(?!たい|ち|てら))/
    specs:
      - from: 件の数えが
        to: 件の計数が
  - expected: エッジケース
    pattern: 端のケース
  - expected: worktree
    pattern: 作業木
  - expected: スイープ
    pattern: 掃引
  - expected: ポイントワイズの断面積
    pattern: 点断面積
  # ADR で見つけた語。英語の直訳
  - expected: フロントマター
    # 「名前付け」「以前付けた」は別の語
    pattern: /(?<![名以事])前付け(?![たるてな])/
    specs:
      - from: 前付けの検査
        to: フロントマターの検査
  - expected: ラッパー
    # 動詞の「包み込む」「包み直す」「包みます」と、「包み紙」「小包み」は通す。名詞の「包み」は、後ろに付く
    # 助詞や括弧が多い（包みごと、包み（env）、包みと）ので、動詞の形を除く書き方にする。行を折り返した動詞
    # （包み⏎込む）も通すため、除く語の前に改行を許す
    pattern: /(?<![小お])包み(?!\n?(?:込|紙|直|隠|切|ます|ながら|つつ|がち))/
    specs:
      - from: コマンドの包みを解く
        to: コマンドのラッパーを解く
      - from: 包みごとの意味
        to: ラッパーごとの意味
      - from: ケーキを包み直す
        to: ケーキを包み直す
  # 「音を拾う」のような別の意味は通す。prh は一致した部分だけを直す語に置き換えるので、活用の語尾まで含める
  - expected: panic を捕捉する
    pattern: panic を拾う
    specs:
      - from: panic を拾う経路
        to: panic を捕捉する経路
  - expected: panic を捕捉し
    pattern: /panic を拾い(?!物|上|出)/
    specs:
      - from: panic を拾い、出す
        to: panic を捕捉し、出す
  - expected: panic を捕捉して
    pattern: panic を拾って
    specs:
      - from: panic を拾って終わる
        to: panic を捕捉して終わる
  - expected: 捕捉した panic
    pattern: 拾った panic
    specs:
      - from: 拾った panic も数える
        to: 捕捉した panic も数える
  - expected: panic を捕捉した
    pattern: panic を拾った
  - expected: panic を捕捉せず
    pattern: panic を拾わず
  # 動詞の連用形をそのまま名詞にしたもの
  - expected: 漏れ
    # 「抜ける」「抜けがち」は動詞。「すり抜け」「引き抜け」「底抜け」のような複合語は別の語なので、
    # 助詞、連体の「な」、読点の直後（判定に抜けが、致命的な抜けを、抜けを塞ぐ）と文頭だけを止める
    pattern: /(?<=[にがのをはもでな、]|^)抜け(?=[をの]|が(?!たい|ち|てら))/
    specs:
      - from: 判定に抜けが続いた
        to: 判定に漏れが続いた
      - from: すり抜けを塞ぐ
        to: すり抜けを塞ぐ
  - expected: 照合
    # 直後が「は」「、」のときは、動詞の「突き合わせはしない」「突き合わせ、同じなら」と見分けられないので止めない
    pattern: /突き合わせ(?=[のでをだ：:）」]|が(?!たい|ち|てら))/
    specs:
      - from: 突き合わせが止める
        to: 照合が止める
      - from: 前の台帳と突き合わせ、同じなら
        to: 前の台帳と突き合わせ、同じなら
  - expected: 開始の
    pattern: /始まりの(?=見込み)/
    specs:
      - from: 始まりの見込み
        to: 開始の見込み
  - expected: 開始マーカー
    pattern: 始まりの印
    specs:
      - from: 署名の始まりの印
        to: 署名の開始マーカー
  - expected: テンプレート
    pattern: 雛形
    specs:
      - from: 雛形を作る
        to: テンプレートを作る
  # 表記ゆれ（ADR 38 本で多い方に揃える）
  - expected: すべて
    pattern: /(?<![一-龥])全て/
    specs:
      - from: 全てのコミット
        to: すべてのコミット
  - expected: つき
    # カタカナ、英数字、backtick、閉じ括弧と、名詞とみなす語（日付、見出し、番号、条件、注釈）の直後だけを
    # 止める。「追い付き」「結び付き」「気付き」のような漢字とひらがなの複合動詞を、除外の列挙で避けない
    pattern: /(?<=[ァ-ヶーA-Za-z0-9`）]|` |日付|見出し|番号|連番|条件|注釈)付き(?!合|添|まと)/
    specs:
      - from: パス付きの指定
        to: パスつきの指定
      - from: 日付付きの追記
        to: 日付つきの追記
      - from: 追い付きを待つ
        to: 追い付きを待つ
  - expected: symlink
    pattern: シンボリックリンク
    specs:
      - from: シンボリックリンクを作る
        to: symlinkを作る
  # コミットメッセージの履歴（PR #228「直訳の造語を一般的な技術用語に直す」）で直した造語。
  # 同じ PR で直した「配備」「幻覚」「退行」は、人員の配備や医学の退行のような別の意味があり、
  # 1 つの語に直せないので入れない
  - expected: 区切り文字
    pattern: 終端子
    specs:
      - from: 終端子を探す
        to: 区切り文字を探す
  - expected: 不正シャットダウン
    pattern: 汚い電源断
    specs:
      - from: 汚い電源断で壊れる
        to: 不正シャットダウンで壊れる
  - expected: 依存パッケージ
    pattern: 依存物
    specs:
      - from: 依存物を入れる
        to: 依存パッケージを入れる
  # コピーの意味の「写す」。文脈でコピー、ミラー、重複して書くのどれにもなるので、直す語は活用の形ごとに
  # 示す（「写真を撮る」「画面に映す」「顔が写らない」は別の語なので通す）。どの意味でもコピーと言い換えて
  # 意味が変わらないので、1 つの語に直せない語を入れない方針には反しない
  - expected: コピーする
    pattern: /(?:書き写|(?<![一-龥])写)す/
    specs:
      - from: 全部書き写す
        to: 全部コピーする
      - from: ファイルを写す
        to: ファイルをコピーする
  - expected: コピーして
    pattern: /(?:書き写|(?<![一-龥])写)して/
    specs:
      - from: 設定を写して
        to: 設定をコピーして
  - expected: コピーした
    pattern: /(?:書き写|(?<![一-龥])写)した/
    specs:
      - from: 設定を写した
        to: 設定をコピーした
  - expected: コピーせず
    pattern: /(?:書き写|(?<![一-龥])写)さず/
    specs:
      - from: 権限を写さず
        to: 権限をコピーせず
  - expected: コピーしない
    pattern: /(?:書き写|(?<![一-龥])写)さない/
    specs:
      - from: 権限を写さない
        to: 権限をコピーしない
  - expected: コピーされ
    pattern: /(?:書き写|(?<![一-龥])写)され/
    specs:
      - from: 書き写されている
        to: コピーされている
  - expected: コピーし続ける
    pattern: /(?:書き写|(?<![一-龥])写)し続ける/
    specs:
      - from: 全部書き写し続ける
        to: 全部コピーし続ける
  - expected: コピー
    # 「写しの先」「写しにする」。「写し絵」のような別の語と、動詞の「写し、」は通す
    pattern: /(?:書き写|(?<![一-龥])写)し(?=[のをでにだ（]|が(?!たい|ち|てら))/
    specs:
      - from: 作業用の写しにする
        to: 作業用のコピーにする
