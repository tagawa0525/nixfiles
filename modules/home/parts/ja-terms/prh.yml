  - expected: バランス
    # 名詞の用法だけを止める。続く文字を、名詞にしか続かないもの（助詞、括弧、句点。「や」は「やすい」を除く）に
    # 限り、動詞の「釣り合う」と連用形（釣り合い、かつ。釣り合いません）は通す。読点は連用形にも続くので、前が
    # 「の」のときだけ止める。別の語の「不釣り合い」は通す。既定で止めて連用形の形を除く書き方は、除く形を
    # 列挙しきれず捨てた（ADR-0014 の補足）
    pattern: /(?<!不|中性子の)釣り合い(?=[のをではもと（）」。]|や(?!す)|に(?!く)|が(?!たい|ち|てら))|(?<=の)(?<!中性子の)釣り合い(?=[、,])/
