# 崩れた日本語の語の辞書（ADR-0014）。グローバルの pre-commit と commit-msg が textlint-rule-prh で使う。
#
# 型は 2 つ。動詞の連用形をそのまま名詞にしたもの（確かめ、比べ、数え）は、前後の文字で名詞の用法だけを
# 止め、動詞（確かめる、比べると）は通す。英語の直訳の造語は、その語だけを止める。直す語が文脈で変わる語
# （「効き」は「影響」「効果」「効くか」のどれにもなる）は、1 つの語に直せないので入れない。
# specs は prh が辞書を読み込むときに確かめる例（from を to に直す）。
#
# 出典: xlc の references/history-rewrite/cb_lib.py の RULES（2026-10-11 に xlc の履歴を書き換えたときの規則。
# xlc に固有の 2 つと、文脈で直す語が変わる「効き」は除く）、nixfiles と xlc のメモリへのユーザーの指摘
version: 1
rules:
  - expected: 確認
    # 直後が「の」「を」などの名詞の用法だけを止める。「に」「も」「は」と空白、行末は動詞にも続く（確かめにくい、
    # 確かめもせず、確かめはした、確かめ Slurm に、行の折り返しの 確かめ⏎る）
    pattern: /確かめ(?=[のでをがだ：:）」])/
    specs:
      - from: 確かめの結果
        to: 確認の結果
      - from: 確かめが通る
        to: 確認が通る
      - from: 結果を確かめる
        to: 結果を確かめる
      - from: 確かめにくい
        to: 確かめにくい
      - from: 確かめもせず
        to: 確かめもせず
  - expected: 比較
    pattern: /比べ合わせ(?=[のでをがだ：:）」])/
    specs:
      - from: 比べ合わせの結果
        to: 比較の結果
      - from: 2 つを比べ合わせると
        to: 2 つを比べ合わせると
  - expected: 比較
    pattern: /(?<=[の、])比べ(?=[での」（はが])/
    specs:
      - from: 2 つの比べでは
        to: 2 つの比較では
      - from: 、比べは
        to: 、比較は
      - from: 2 つを比べると
        to: 2 つを比べると
  - expected: 計数
    pattern: /(?<=の)数え(?=[はのをが）：:]|$)/
    specs:
      - from: 件の数えは
        to: 件の計数は
  - expected: エッジケース
    pattern: 端のケース
  - expected: worktree
    pattern: 作業木
  - expected: スイープ
    pattern: 掃引
  - expected: ポイントワイズの断面積
    pattern: 点断面積
