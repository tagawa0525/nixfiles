# 崩れた日本語の語の辞書（ADR-0014）。グローバルの pre-commit と commit-msg が textlint-rule-prh で使う。
#
# 型は 2 つ。動詞の連用形をそのまま名詞にしたもの（確かめ、比べ、数え）は、前後の文字で名詞の用法だけを
# 止め、動詞（確かめる、比べると）は通す。英語の直訳の造語は、その語だけを止める。直す語が文脈で変わる語
# （「効き」は「影響」「効果」「効くか」のどれにもなる）は、1 つの語に直せないので入れない。
# specs は prh が辞書を読み込むときに確かめる例（from を to に直す）。
#
# 出典: xlc の references/history-rewrite/cb_lib.py の RULES（2026-10-11 に xlc の履歴を書き換えたときの規則。
# xlc に固有の 2 つと、文脈で直す語が変わる「効き」は除く）、nixfiles と xlc のメモリへのユーザーの指摘
version: 1
rules:
  - expected: 確認
    # 直後が「の」「を」などの名詞の用法だけを止める。「に」「も」「は」と空白、行末は動詞にも続く（確かめにくい、
    # 確かめもせず、確かめはした、確かめ Slurm に、行の折り返しの 確かめ⏎る）。「が」も、後に「たい」「ち」
    # 「てら」が続けば動詞（確かめがたい、確かめがち、確かめがてら）
    pattern: /確かめ(?=[のでをだ：:）」]|が(?!たい|ち|てら))/
    specs:
      - from: 確かめの結果
        to: 確認の結果
      - from: 確かめが通る
        to: 確認が通る
      - from: 結果を確かめる
        to: 結果を確かめる
      - from: 確かめにくい
        to: 確かめにくい
      - from: 確かめもせず
        to: 確かめもせず
      - from: 確かめがたい
        to: 確かめがたい
  - expected: 比較
    pattern: /比べ合わせ(?=[のでをだ：:）」]|が(?!たい|ち|てら))/
    specs:
      - from: 比べ合わせの結果
        to: 比較の結果
      - from: 2 つを比べ合わせると
        to: 2 つを比べ合わせると
  - expected: 比較
    pattern: /(?<=[の、])比べ(?=[での」（]|が(?!たい|ち|てら))/
    specs:
      - from: 2 つの比べでは
        to: 2 つの比較では
      - from: 、比べが
        to: 、比較が
      - from: 、比べはした
        to: 、比べはした
      - from: 2 つを比べると
        to: 2 つを比べると
  - expected: 計数
    pattern: /(?<=の)数え(?=[のを）：:]|が(?!たい|ち|てら))/
    specs:
      - from: 件の数えが
        to: 件の計数が
  - expected: エッジケース
    pattern: 端のケース
  - expected: worktree
    pattern: 作業木
  - expected: スイープ
    pattern: 掃引
  - expected: ポイントワイズの断面積
    pattern: 点断面積
  # ADR の語（2026-10-21 に docs/adr の 38 本から拾った）。英語の直訳
  - expected: フロントマター
    pattern: 前付け
  - expected: ラッパー
    # 「包み込む」「包み紙」は通す
    pattern: /包み(?=[のをがで・、])/
  - expected: 捕捉
    # 「音を拾う」のような別の意味は通す。panic の前後だけを止める
    pattern: /(?<=panic を)拾|拾(?=った panic)/
  # 動詞の連用形をそのまま名詞にしたもの
  - expected: 漏れ
    # 「抜ける」「抜けがち」は動詞
    pattern: /抜け(?=[をの]|が(?!たい|ち|てら))/
  - expected: 照合
    # 直後が「は」のときは、動詞の「突き合わせはしない」と見分けられないので止めない
    pattern: /突き合わせ(?=[のでをだ：:）」、]|が(?!たい|ち|てら))/
  - expected: 開始の
    pattern: /始まりの(?=見込み)/
  - expected: 開始マーカー
    pattern: 始まりの印
  - expected: テンプレート
    pattern: 雛形
  # 表記ゆれ（ADR 38 本で多い方に揃える）
  - expected: すべて
    pattern: /(?<![一-龥])全て/
  - expected: つき
    # 「気付き」「片付き」のように漢字が前に付く語は通す
    pattern: /(?<=[ァ-ヶー]|` )付き(?=[のをで、。）]|は)/
  - expected: symlink
    pattern: シンボリックリンク
  # コミットメッセージの履歴（PR #228「直訳の造語を一般的な技術用語に直す」）で直した造語
  - expected: デプロイ
    pattern: 配備
  - expected: 区切り文字
    pattern: 終端子
  - expected: 不正シャットダウン
    pattern: 汚い電源断
  - expected: 依存パッケージ
    pattern: 依存物
  - expected: ハルシネーション
    pattern: 幻覚
  - expected: リグレッション
    pattern: 退行
