# =============================================================================
# claude-hooks: Claude Code の PreToolUse hook（Bash ツールのコマンド検査）
# =============================================================================
# 10 本あった bash hook を 1 バイナリに統合したもの。コマンド文字列は正規表現ではなく
# tree-sitter-bash で構文解析し、ヒアドキュメント本文・クォート・コマンド置換を
# ノード種別として扱う。claude-code.nix からビルドされる。
# =============================================================================
[package]
name = "claude-hooks"
version = "0.1.0"
edition = "2024"

[dependencies]
# bash の構文解析。入力を拒否せず ERROR ノードで継続するため hook 向き
tree-sitter = "0.25"
tree-sitter-bash = "0.25.1"
# hook の入出力 JSON
serde_json = "1"
# 機密情報パターンと GraphQL mutation の検出。tree-sitter が既に依存している
regex = "1"
