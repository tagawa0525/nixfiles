# プロジェクトの pre-commit の設定。グローバルの git hook（claude-harness の modules/home/parts/git-hooks.nix）が prek で実行する
repos:
  - repo: local
    hooks:
      # 設計の記録（docs/adr）の形と参照（claude-harness の ADR-0009）
      - id: design-records
        name: design-records
        entry: design-records check --changed
        language: system
        always_run: true # ADR を消すだけのコミット（渡すファイルが無い）でも検査する
        require_serial: true # ADR どうしの検査を 1 回で（分けて呼ぶと同じ指摘が重なる）
        types: [text]
        verbose: true # 通ったときも warning を見せる
      # ハーネス（flake input の claude-harness）のスクリプトが固定で持つ名前と値を、こちらの構成と照合する。
      # 約束に関わるファイルを変えるコミットでだけ走る（hook をビルドするので、数秒から数十秒かかる）
      - id: harness-contract
        name: harness-contract
        entry: bash modules/home/parts/tests/harness-contract.sh
        language: system
        files: ^(modules/slurm/(common|nfs-entry)\.nix|modules/home/scripts/nix-rebuild\.sh|modules/home/parts/tests/harness-contract\.sh)$
        pass_filenames: false
