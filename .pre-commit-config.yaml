# プロジェクトの pre-commit の設定。グローバルの git hook（modules/home/parts/git.nix）が prek で走らせる
repos:
  - repo: local
    hooks:
      # 設計の記録（docs/adr）の形と参照（ADR-0009）
      - id: design-records
        name: design-records
        entry: design-records check
        language: system
        always_run: true
        require_serial: true # ADR どうしの検査を 1 回で（分けて呼ぶと同じ指摘が重なる）
        types: [text]
        verbose: true # 通ったときも warning を見せる
